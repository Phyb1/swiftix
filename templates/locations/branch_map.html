{% if branches %}
<div class="branch-list">
    {% for branch in branches %}
    <div class="branch-card">
        {% if branch.map_image %}
            <img src="{{ branch.map_image.url }}" alt="Map showing {{ branch.name }}" class="branch-map-image">
        {% endif %}
        <div class="branch-details">
            <strong>{{ branch.name }}</strong>
            <p>{{ branch.address }}</p>
            <a href="{{ branch.get_directions_url }}" target="_blank" rel="noopener" class="btn">Get directions</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
